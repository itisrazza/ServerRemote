name: Feature request
description: Suggest an idea or an improvement that isn't about a specific protocol.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://github.com/itisrazza/ServerRemote/blob/main/docs/architecture/roadmap.md)
        lists what's already planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you'd like it to work.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you've considered.
