name: Build

# Release builds for each desktop platform, uploaded as artifacts. Only for
# the main line and release branches; other branches get CI checks only.
#
# - main: development builds, named after the commit.
# - release/vX.Y: release candidates, named after the version and commit.
#   A validated candidate is what release.yml signs and publishes, so it
#   doesn't rebuild. See docs/releasing.md.
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'

permissions:
  contents: read

# A newer push to the same branch supersedes an in-progress build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v7

      # On a release branch the workspace version must belong to that branch
      # (release/v0.2 builds 0.2.x), so candidates can't carry a stale version.
      - name: Work out the build label
        id: label
        run: |
          sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            series="${GITHUB_REF_NAME#release/v}"
            if [[ "$version" != "$series".* ]]; then
              echo "::error::Cargo.toml has version $version, but $GITHUB_REF_NAME builds $series.x"
              exit 1
            fi
            label="$version-rc.$sha"
            {
              echo "## Release candidate $version"
              echo
              echo "Commit \`$sha\`. Install the artifacts below to test it."
              echo "Once validated, tag this commit to release it:"
              echo
              echo '```sh'
              echo "git tag -a v$version $GITHUB_SHA -m 'ServerRemote $version'"
              echo "git push origin v$version"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            label="$sha"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: label
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            platform: windows-x64
            targets: [x86_64-pc-windows-msvc]
          # Xcode 26's actool, to compile the Icon Composer icon.
          - name: macOS (universal)
            os: macos-26
            platform: macos-universal
            targets: [aarch64-apple-darwin, x86_64-apple-darwin]
          - name: Linux (x64)
            os: ubuntu-latest
            platform: linux-x64
            targets: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ join(matrix.targets, ',') }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build
        run: |
          for target in ${{ join(matrix.targets, ' ') }}; do
            cargo build --release --locked -p server-remote --target "$target"
          done

      - name: Stage artifact
        id: stage
        run: |
          name="server-remote-${{ needs.label.outputs.label }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"

          case "${{ matrix.platform }}" in
            windows-*)
              cp "target/${{ matrix.targets[0] }}/release/server-remote.exe" "dist/$name/"
              ;;
            macos-universal)
              lipo -create \
                target/aarch64-apple-darwin/release/server-remote \
                target/x86_64-apple-darwin/release/server-remote \
                -output dist/server-remote
              scripts/bundle-macos.sh dist/server-remote "dist/$name"
              ;;
            *)
              cp "target/${{ matrix.targets[0] }}/release/server-remote" "dist/$name/"
              ;;
          esac

          # The macOS bundle carries its licences in Contents/Resources.
          if [[ "${{ matrix.platform }}" != macos-* ]]; then
            cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
            cp apps/desktop/assets/fonts/OFL.txt "dist/$name/OFL-NunitoSans.txt"
          fi

          # Artifact zips drop the executable bit, so Unix builds go in a
          # tarball inside the artifact.
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            echo "path=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
