name: CI

on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Builds for a store (Microsoft Store, Flathub, the App Store) leave out
      # the update check; make sure that still builds cleanly.
      - name: Clippy without the update check
        run: cargo clippy -p server-remote-app -p server-remote --no-default-features --all-targets -- -D warnings

  ipados:
    name: iPadOS app
    # Apple silicon, with Xcode 26 and the iOS 26 SDK the app needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: scripts/check-ipados.sh

  linux-metadata:
    name: Linux metadata
    # Current AppStream: the one in older Ubuntus predates tags Flathub
    # requires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends desktop-file-utils appstream
      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/io.razza.ServerRemote.desktop
      - name: Validate the AppStream metadata
        run: appstreamcli validate --no-net --explain packaging/linux/io.razza.ServerRemote.metainfo.xml

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --workspace --no-report
      - name: Print summary
        run: |
          {
            echo "## Coverage summary"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate HTML report
        run: cargo llvm-cov report --html
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14
