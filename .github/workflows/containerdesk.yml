name: Publish containerdesk

on:
  push:
    branches: [main]
    paths:
      - 'mock/containerdesk/**'
      - 'mock/containerdesk-vnc/**'
      - 'mock/containerdesk-rdp/**'
      - '.github/workflows/containerdesk.yml'
  workflow_dispatch:

env:
  BASE_IMAGE: ghcr.io/itisrazza/containerdesk
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base first, as a multi-arch manifest: the protocol images layer on it
      # and pull the matching-arch base from the registry per platform, so it
      # has to be pushed before they build.
      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: mock/containerdesk
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.BASE_IMAGE }}:latest

      - name: Build and push VNC
        uses: docker/build-push-action@v7
        with:
          context: mock/containerdesk-vnc
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/itisrazza/containerdesk-vnc:latest
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:latest

      - name: Build and push RDP
        uses: docker/build-push-action@v7
        with:
          context: mock/containerdesk-rdp
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/itisrazza/containerdesk-rdp:latest
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:latest

      # SPICE is intentionally left out until it's verified on a Linux host.
      # To publish it, add its path to the trigger above and a step here that
      # mirrors the VNC/RDP builds against mock/containerdesk-spice.
