[package]
name = "server-remote-app"
description = "ServerRemote's application logic, shared by its desktop and tablet front ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["update-check"]
# Checking GitHub Releases for a newer version. Off for builds distributed
# through a store (Microsoft Store, Flathub, the App Store), which update
# the app themselves.
update-check = ["dep:ureq"]

[dependencies]
directories = "6.0.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust-embed = "8.14.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
server-remote-core = { path = "../../lib/core" }
server-remote-icons = { path = "../../lib/icons" }
server-remote-ilo = { path = "../../connectors/ilo" }
server-remote-spice = { path = "../../connectors/spice" }
server-remote-vnc = { path = "../../connectors/vnc" }
tokio = { version = "1.52.3", features = ["rt", "sync"] }
toml = "1.1.3"
ureq = { version = "3.5.2", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
