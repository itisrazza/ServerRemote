[package]
name = "server-remote"
description = "A universal remote desktop / console client (VNC today; Spice and iLO 4 in progress)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["update-check"]
# See server-remote-app's feature of the same name.
update-check = ["server-remote-app/update-check"]

[dependencies]
directories = "6.0.0"
i18n-embed-fl = "0.10.1"
iced = { version = "0.14.0", features = ["advanced", "tokio", "image"] }
iced_wgpu = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.5"
resvg = "0.50.0"
rfd = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
server-remote-app = { path = "../core", default-features = false }
server-remote-core = { path = "../../lib/core" }
server-remote-icons = { path = "../../lib/icons", features = ["iced"] }
server-remote-ilo = { path = "../../connectors/ilo" }
server-remote-spice = { path = "../../connectors/spice" }
server-remote-vnc = { path = "../../connectors/vnc" }
tokio = { version = "1.52.3", features = ["rt", "sync"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
semver = "1.0.28"
iced_test = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.27.0"
