[package]
name = "server-remote"
description = "A universal remote desktop / console client (VNC today; Spice and iLO planned)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
iced = { version = "0.14.0", features = ["advanced", "tokio", "image"] }
iced_wgpu = "0.14.0"
open = "5.4.5"
resvg = "0.45.1"
rfd = "0.18.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
server-remote-core = { path = "../../lib/core" }
server-remote-icons = { path = "../../lib/icons", features = ["iced"] }
server-remote-spice = { path = "../../connectors/spice" }
server-remote-vnc = { path = "../../connectors/vnc" }
tokio = { version = "1.52.3", features = ["rt", "sync"] }
toml = "1.1.3"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
iced_test = "0.14.0"
tempfile = "3.27.0"
