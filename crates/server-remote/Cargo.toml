[package]
name = "server-remote"
description = "A universal remote desktop / console client (VNC today; Spice and iLO planned)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
iced = { version = "0.14.0", features = ["advanced", "tokio", "image"] }
iced_wgpu = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
server-remote-core = { path = "../server-remote-core" }
server-remote-icons = { path = "../icons", features = ["iced"] }
server-remote-spice = { path = "../server-remote-spice" }
server-remote-vnc = { path = "../server-remote-vnc" }
tokio = { version = "1.52.3", features = ["sync"] }
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
