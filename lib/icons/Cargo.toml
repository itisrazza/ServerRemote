[package]
name = "server-remote-icons"
description = "The app's icon set (Carbon icons exported from the Figma design), embedded at compile time, with optional iced integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
iced = ["dep:iced"]

[dependencies]
iced = { version = "0.14.0", optional = true, default-features = false, features = [
    "svg",
    "thread-pool",
] }
